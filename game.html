<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4c90ff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23080c1a' width='192' height='192'/><circle cx='96' cy='96' r='88' stroke='%234c90ff' stroke-width='4' fill='rgba(76,144,255,0.1)'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='100' fill='%234c90ff' font-family='Orbitron' font-weight='900'>∑</text></svg>">
  <title>Aventuras Numéricas - Juego</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='menu.html'">← Menú</button>
      <div class="user-info">
        <span class="coins-badge" id="displayCoins">💰 0</span>
        <span class="xp-badge" id="displayXP">⭐ 0 XP</span>
      </div>
    </div>
    
    <div id="gameChoice">
      <h2 style="text-align:center;margin:20px 0;font-family:'Orbitron',monospace;color:#4c90ff;">🎮 ¿Cómo quieres jugar?</h2>
      <div class="game-options" style="display: grid; grid-template-columns: 1fr; gap: 25px; max-width: 600px; margin: 40px auto;">
        <button class="game-btn animated bounceIn" id="calcBtn" style="padding: 60px 20px; font-size: 28px; background: linear-gradient(135deg, rgba(76,144,255,0.2), rgba(155,89,255,0.2)); border: 2px solid #4c90ff; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
          <span class="icon" style="font-size: 70px; display: block; margin-bottom: 15px;">🧮</span>
          <b style="font-family: 'Orbitron';">RESOLVER ECUACIONES</b>
          <br><small style="font-size: 16px; opacity: 0.8;">Práctica con gráficos interactivos</small>
        </button>
        <button class="game-btn animated bounceIn" id="quizBtn" style="padding: 60px 20px; font-size: 28px; background: linear-gradient(135deg, rgba(76,255,144,0.15), rgba(76,144,255,0.15)); border: 2px solid #4cff90; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
          <span class="icon" style="font-size: 70px; display: block; margin-bottom: 15px;">🎯</span>
          <b style="font-family: 'Orbitron';">MODO QUIZ</b>
          <br><small style="font-size: 16px; opacity: 0.8;">Gana XP, Monedas y usa Poderes</small>
        </button>
      </div>
    </div>

    <div id="calculatorSection" class="section hidden">
      <h2>🧮 Resolver Ecuaciones</h2>
      <input id="eqInput" placeholder="Ej: x^2 - 3x + 2 = 0" />
      <button id="solveBtn" class="btn-primary">Resolver</button>
      <div id="calcResult" class="result-box"></div>
      <canvas id="calcChart" style="margin-top:20px; background: rgba(255,255,255,0.05); border-radius: 10px;"></canvas>
    </div>

    <div id="quizSection" class="section hidden">
      <div id="quizSetup">
        <h2>❓ Responder Preguntas</h2>
        <select id="quizDifficulty">
          <option value="facil">😊 Fácil (+10 XP, +2 monedas)</option>
          <option value="normal">😐 Normal (+25 XP, +5 monedas)</option>
          <option value="dificil">😤 Difícil (+50 XP, +10 monedas)</option>
          <option value="experto">🔥 Experto (+100 XP, +20 monedas)</option>
        </select>
        <button id="startQuizBtn" class="btn-primary">Comenzar</button>
      </div>
      <div id="quizGame" class="hidden"></div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
