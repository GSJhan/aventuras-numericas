<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras Numéricas - Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="user-info">
        <h1>🧮 Calculadora de Ecuaciones</h1>
        <div class="stats">
          <span class="stat stat-coins">💰 <span id="displayCoins">0</span></span>
          <span class="stat stat-xp">⭐ <span id="displayXP">0</span> XP</span>
          <span class="stat stat-level">🏆 Nivel <span id="displayLevel">1</span></span>
        </div>
      </div>
      <button id="backToMenu" class="logout-btn">← Volver</button>
    </div>
    
    <div class="section">
      <p class="hint">Ejemplo: x^2-3x+2=0</p>
      <input type="text" id="eqInput" placeholder="x^2-3x+2=0">
      <button id="solveBtn" class="btn-primary">Resolver</button>
      <div id="calcResult" class="result-box"></div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
