<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugar - Aventuras Numéricas</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='menu.html'">← Volver</button>
      <div class="user-info">
        <span class="coins-badge" id="displayCoins">💰 0</span>
        <span class="xp-badge" id="displayXP">⭐ 0 XP</span>
      </div>
    </div>
    
    <div id="gameChoice" class="game-options">
      <button class="game-btn" id="calcBtn">
        <span class="icon">🧮</span>
        Calcular<br><small>Ecuaciones</small>
      </button>
      <button class="game-btn" id="quizBtn">
        <span class="icon">🎯</span>
        Quiz<br><small>Desafío Matemático</small>
      </button>
    </div>

    <!-- CALCULADORA -->
    <div id="calculatorSection" class="section hidden">
      <h2>🧮 Calculadora de Ecuaciones</h2>
      <p style="opacity:0.7;margin-bottom:12px">Ejemplo: x^2-5x+6=0 o 2x+4=0</p>
      <input id="eqInput" placeholder="Escribe tu ecuación aquí..." />
      <button id="solveBtn" class="btn-primary">Resolver Paso a Paso</button>
      <div id="calcResult" class="result-box"></div>
    </div>

    <!-- QUIZ -->
    <div id="quizSection" class="section hidden">
      <h2>🎯 Desafío de Preguntas</h2>
      <div id="quizSetup">
        <select id="quizDifficulty">
          <option value="facil">😊 Fácil: Suma/Resta (+10 XP)</option>
          <option value="normal">😐 Normal: Mult/Div (+25 XP)</option>
          <option value="dificil">😤 Difícil: Potencia/Raíz (+50 XP)</option>
          <option value="experto">🔥 Experto: Ecuaciones (+100 XP)</option>
        </select>
        <button id="startQuizBtn" class="btn-primary">¡Comenzar!</button>
      </div>

      <div id="quizStats" style="display:none; margin-top:20px;">
        <div id="currentStreakDisplay" style="font-size:24px; color:#ff9500; font-weight:bold; text-align:center;">🔥 Racha: 0</div>
      </div>

      <div id="quizGame" class="question-box" style="display:none; margin-top:20px;">
        <div id="questionText" class="question-text">?</div>
        <input type="number" id="quizAnsInput" placeholder="Tu respuesta..." style="font-size:24px; text-align:center; padding:15px; width:100%;" />
        <button onclick="window.checkQuizAnswer()" class="btn-primary" style="margin-top:20px;">Enviar Respuesta</button>
      </div>
    </div>
  </div>
  <div class="music-control">
    <button id="floatingMusicBtn" class="music-btn off">🔇</button>
  </div>
  <audio id="bgMusic" loop></audio>
  <script type="module" src="game.js"></script>
</body>
</html>
