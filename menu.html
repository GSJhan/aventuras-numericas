<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras Numéricas - Menú</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="user-info">
        <h1>✨ Aventuras Numéricas ✨</h1>
        <div class="stats">
          <span class="stat">👤 <span id="displayUsername">---</span></span>
          <span class="stat stat-coins">💰 <span id="displayCoins">0</span></span>
          <span class="stat stat-xp">⭐ <span id="displayXP">0</span> XP</span>
          <span class="stat stat-level">🏆 Nivel <span id="displayLevel">1</span></span>
        </div>
      </div>
      <button id="logoutBtn" class="logout-btn">🚪 Salir</button>
    </div>

    <!-- Avatar -->
    <div class="avatar-container">
      <div class="avatar" id="avatarDisplay">🕷️</div>
    </div>

    <!-- Menú -->
    <div class="menu-grid">
      <button class="menu-btn" data-page="game">
        <span class="icon">🎮</span>
        Jugar
      </button>
      <button class="menu-btn" data-page="infinito">
        <span class="icon">∞</span>
        Infinito
      </button>
      <button class="menu-btn" data-page="tienda">
        <span class="icon">🛒</span>
        Tienda
      </button>
      <button class="menu-btn" data-page="ranking">
        <span class="icon">🏆</span>
        Ranking
      </button>
      <button class="menu-btn" data-page="logros">
        <span class="icon">🎖️</span>
        Logros
      </button>
      <button class="menu-btn" data-page="config">
        <span class="icon">⚙️</span>
        Config
      </button>
    </div>

    <!-- Secciones -->
    <div id="gameSection" class="section hidden">
      <h2>🎮 Modos de Juego</h2>
      <div class="game-modes">
        <button id="goToQuiz" class="mode-btn">❓ Modo Quiz</button>
        <button id="goToCalculator" class="mode-btn">🧮 Calculadora</button>
      </div>
    </div>

    <div id="quizSection" class="section hidden">
      <button class="back-btn" id="backFromQuiz">← Volver</button>
      <h2>❓ Modo Quiz</h2>
      <select id="difficultySelect">
        <option value="facil">😊 Fácil (+10 XP, +2💰)</option>
        <option value="normal">😐 Normal (+25 XP, +5💰)</option>
        <option value="dificil">😤 Difícil (+50 XP, +10💰)</option>
      </select>
      <button id="startQuiz" class="btn-primary">🎯 Comenzar</button>
      <div id="quizArea"></div>
      <div id="quizResult" class="result-box hidden"></div>
    </div>

    <div id="calculatorSection" class="section hidden">
      <button class="back-btn" id="backFromCalc">← Volver</button>
      <h2>🧮 Calculadora</h2>
      <p class="hint">Ejemplo: x^2-3x+2=0</p>
      <input type="text" id="equationInput" placeholder="x^2-3x+2=0">
      <button id="solveBtn" class="btn-primary">Resolver</button>
      <div id="calcResult" class="result-box"></div>
    </div>

    <div id="infinitoSection" class="section hidden">
      <button class="back-btn" id="backFromInfinito">← Volver</button>
      <h2>∞ Modo Infinito</h2>
      <div id="infinityProblem" class="problem-box">
        <div class="problem-text">Cargando...</div>
      </div>
      <input type="number" id="infinityAnswer" placeholder="Tu respuesta">
      <button id="checkInfinity" class="btn-primary">Verificar</button>
      <div id="infinityResult" class="result-box"></div>
    </div>

    <div id="tiendaSection" class="section hidden">
      <button class="back-btn" id="backFromTienda">← Volver</button>
      <h2>🛒 Tienda de Avatares</h2>
      <div id="shopItems" class="skins-grid"></div>
    </div>

    <div id="rankingSection" class="section hidden">
      <button class="back-btn" id="backFromRanking">← Volver</button>
      <h2>🏆 Ranking Global</h2>
      <div id="rankingList"></div>
    </div>

    <div id="logrosSection" class="section hidden">
      <button class="back-btn" id="backFromLogros">← Volver</button>
      <h2>🎖️ Logros</h2>
      <div id="logrosList" class="logros-grid"></div>
    </div>

    <div id="configSection" class="section hidden">
      <button class="back-btn" id="backFromConfig">← Volver</button>
      <h2>⚙️ Configuración</h2>
      <label>Tema de fondo:</label>
      <select id="themeSelect">
        <option value="default">🌈 Por defecto</option>
        <option value="dark">🌙 Oscuro</option>
        <option value="nature">🌿 Naturaleza</option>
      </select>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
