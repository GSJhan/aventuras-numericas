<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú - Aventuras Numéricas</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1 id="displayUsername">Usuario</h1>
      <div class="user-info">
        <span id="displayCoins" class="coins-badge">💰 0</span>
        <span id="displayXP" class="xp-badge">⭐ 0 XP</span>
      </div>
    </div>
    <button id="logoutBtn" class="logout-btn">SALIR</button>
  </div>

  <div class="container">
    <div id="avatarDisplay" class="avatar-anime">🦸</div>

    <div class="menu-grid">
      <button class="menu-btn" data-page="game">
        <span class="icon">🎮</span>
        <span>Jugar</span>
      </button>
      <button class="menu-btn" data-page="skills">
        <span class="icon">⭐</span>
        <span>Habilidades</span>
      </button>
      <button class="menu-btn" data-page="ranking">
        <span class="icon">🏅</span>
        <span>Ranking</span>
      </button>
      <button class="menu-btn" data-page="tienda">
        <span class="icon">🛍️</span>
        <span>Tienda</span>
      </button>
      <button class="menu-btn" data-page="logros">
        <span class="icon">🏆</span>
        <span>Logros</span>
      </button>
      <button class="menu-btn" data-page="avatar">
        <span class="icon">👤</span>
        <span>Avatar</span>
      </button>
      <button class="menu-btn" data-page="config">
        <span class="icon">⚙️</span>
        <span>Ajustes</span>
      </button>
    </div>

    <!-- SECCIÓN BARRA XP MEJORADA -->
    <div id="xpBarSection" class="xp-bar-container">
      <div class="xp-header">
        <span class="xp-level">Nivel <span id="xpLevel">1</span></span>
        <span class="xp-progress-text"><span id="xpCurrent">0</span> / <span id="xpNeeded">500</span> XP</span>
      </div>
      <div class="xp-bar-bg">
        <div class="xp-bar-fill" id="xpBarFill" style="width: 0%"></div>
      </div>
      <div class="xp-bar-label">Experiencia</div>
    </div>

    <!-- SECCIÓN HABILIDADES -->
    <div id="skillsSection" class="section hidden">
      <h2>⭐ Tus Habilidades</h2>
      <div class="skills-container">
        <div class="skills-radar-container">
          <canvas id="skillsRadar" width="300" height="300"></canvas>
        </div>
        <div id="skillsStats" class="skills-stats"></div>
      </div>
    </div>

    <!-- SECCIÓN RANKING -->
    <div id="rankingSection" class="section hidden">
      <h2>🏅 Ranking Global</h2>
      <div id="rankingPodium" class="podium-container"></div>
      <div id="rankingList" class="ranking-list"></div>
    </div>

    <!-- SECCIÓN TIENDA -->
    <div id="tiendaSection" class="section hidden">
      <h2>🛍️ Tienda de Poderes</h2>
      <div id="tiendaPoderes" class="tienda-grid"></div>
    </div>

    <!-- SECCIÓN LOGROS -->
    <div id="logrosSection" class="section hidden">
      <h2>🏆 Tus Logros (100+)</h2>
      <div id="logrosList"></div>
    </div>

    <!-- SECCIÓN AVATAR -->
    <div id="avatarSection" class="section hidden">
      <h2>👤 Cambiar Avatar</h2>
      <div id="avatarEditor"></div>
    </div>

    <!-- SECCIÓN AJUSTES -->
    <div id="configSection" class="section hidden">
      <h2>⚙️ Ajustes</h2>
      <div class="card">
        <h3>Música de Fondo</h3>
        <div id="musicStatusText" style="margin-bottom: 10px; opacity: 0.8;">Estado: Desactivada</div>
        <button id="toggleMusicBtnConfig" class="btn-primary">Activar Música</button>
      </div>
      
      <h3 style="margin-top: 20px; color: var(--accent); font-family: 'Orbitron';">Temas Visuales</h3>
      <div id="themesContainer" class="themes-grid">
        <!-- Los temas se cargarán dinámicamente -->
      </div>
    </div>
  </div>

  <!-- MODAL DE NOTIFICACIÓN -->
  <div id="customModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div id="modalIcon" class="modal-icon">✅</div>
      <h3 id="modalTitle">Título</h3>
      <p id="modalMessage">Mensaje aquí</p>
      <button id="modalConfirmBtn" class="btn-primary">Confirmar</button>
    </div>
  </div>

  <div class="music-control">
    <button id="floatingMusicBtn" class="music-btn off">🔇</button>
  </div>
  <audio id="bgMusic" loop></audio>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="menu.js"></script>
</body>
</html>
