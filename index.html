<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras Numéricas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🎮 Aventuras Numéricas</h1>
    <div class="subtitle">Aprende matemáticas jugando</div>
    
    <input type="text" id="username" placeholder="Nombre de usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="loginBtn">Comenzar a Jugar</button>
    
    <div id="message" class="message"></div>
  </div>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const messageDiv = document.getElementById('message');

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      setTimeout(() => {
        messageDiv.className = 'message';
      }, 3000);
    }

    function login() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        showMessage('❌ Completa todos los campos', 'error');
        return;
      }

      // Guardar usuario
      localStorage.setItem('currentUser', username);
      
      // Crear datos si no existen
      if (!localStorage.getItem('user_' + username)) {
        const newUser = {
          username: username,
          xp: 0,
          coins: 100,
          skin: 'spiderman',
          skins: ['spiderman'],
          logros: [],
          estadisticas: {
            preguntas: 0,
            correctas: 0
          }
        };
        localStorage.setItem('user_' + username, JSON.stringify(newUser));
      }
      
      showMessage('✅ ¡Bienvenido ' + username + '!', 'success');
      setTimeout(() => {
        window.location.href = 'menu.html';
      }, 1500);
    }

    loginBtn.onclick = login;
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
