<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aventuras Numéricas — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-1:#0b0f1a;
      --bg-2:#071026;
      --card:#0b0b0b;
      --border:#ffffff;
      --muted:rgba(255,255,255,0.65);
      --accent:rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Rajdhani',sans-serif;background:linear-gradient(180deg,var(--bg-2),var(--bg-1));color:var(--border)}

    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

    .auth-outer{position:relative;text-align:center}
    .brand{margin-bottom:18px}
    .brand h1{margin:0;font-family:'Orbitron',monospace;font-size:28px}

    /* toggle */
    .toggle-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
    .toggle-label{font-size:14px;color:var(--muted)}
    .switch{width:54px;height:28px;border-radius:16px;border:2px solid var(--border);display:inline-block;position:relative;cursor:pointer;background:transparent}
    .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--border);transition:left .18s}
    .switch.on{background:rgba(255,255,255,0.03)}
    .switch.on .knob{left:29px}

    /* card */
    .card{width:340px;max-width:92vw;margin:0 auto;background:transparent;padding:18px;border-radius:6px;border:3px solid var(--border);}
    .card-inner{background:rgba(0,0,0,0.6);padding:18px;border-radius:6px}
    .card h2{margin:0 0 14px 0;font-family:'Orbitron',monospace;font-size:20px}

    .field{margin-bottom:12px}
    .input{width:100%;padding:12px 14px;border-radius:8px;background:transparent;border:2px solid var(--border);color:var(--border);font-weight:600;outline:none}
    .input::placeholder{color:var(--muted)}

    .btn{display:block;margin:12px auto 0 auto;padding:10px 20px;border-radius:8px;background:transparent;border:2px solid var(--border);color:var(--border);font-weight:800;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .msg{margin-top:12px;font-weight:700}
    .msg.ok{color:#6fffb0}
    .msg.err{color:#ff7b7b}

    .switch-link{margin-top:14px;color:var(--muted);font-size:14px}
    .switch-link a{color:var(--border);text-decoration:underline;cursor:pointer}

    @media(max-width:400px){.card{width:92vw}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="auth-outer">
      <div class="brand">
        <h1>Aventuras<br>Numéricas</h1>
      </div>

      <div class="toggle-row">
        <div class="toggle-label">Acceso</div>
        <div id="modeSwitch" class="switch" role="button" aria-pressed="false" tabindex="0">
          <div class="knob"></div>
        </div>
        <div class="toggle-label">Registro</div>
      </div>

      <div class="card" aria-live="polite">
        <div class="card-inner">
          <h2 id="cardTitle">Acceso</h2>

          <form id="accessForm">
            <div class="field"><input id="accessUser" class="input" placeholder="Nombre de usuario" autocomplete="username" /></div>
            <div class="field"><input id="accessPass" type="password" class="input" placeholder="Contraseña" autocomplete="current-password" /></div>
            <button id="accessBtn" class="btn" type="submit">Acceder</button>
          </form>

          <form id="registerForm" style="display:none;">
            <div class="field"><input id="regUser" class="input" placeholder="Nombre de usuario" autocomplete="username" /></div>
            <div class="field"><input id="regPass" type="password" class="input" placeholder="Contraseña" autocomplete="new-password" /></div>
            <button id="regBtn" class="btn" type="submit">Crear Cuenta</button>
          </form>

          <div id="message" class="msg" role="status" aria-live="polite"></div>

          <div class="switch-link">
            <span id="switchHintAccess">¿No tienes cuenta? <a id="toRegister">Crear cuenta</a></span>
            <span id="switchHintRegister" style="display:none;">¿Ya tienes cuenta? <a id="toAccess">Inicia aquí</a></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { onLogin, onRegister } from './src/firebase-adapter.js';

    const modeSwitch = document.getElementById('modeSwitch');
    const cardTitle = document.getElementById('cardTitle');
    const accessForm = document.getElementById('accessForm');
    const registerForm = document.getElementById('registerForm');
    const accessUser = document.getElementById('accessUser');
    const accessPass = document.getElementById('accessPass');
    const regUser = document.getElementById('regUser');
    const regPass = document.getElementById('regPass');
    const messageEl = document.getElementById('message');
    const toRegister = document.getElementById('toRegister');
    const toAccess = document.getElementById('toAccess');
    const switchHintAccess = document.getElementById('switchHintAccess');
    const switchHintRegister = document.getElementById('switchHintRegister');

    let mode = 'access'; // default access

    function setMode(m) {
      mode = m;
      const isReg = m === 'register';
      if (isReg) {
        modeSwitch.classList.add('on');
        modeSwitch.setAttribute('aria-pressed','true');
        registerForm.style.display = '';
        accessForm.style.display = 'none';
        cardTitle.textContent = 'Registro';
        switchHintAccess.style.display = 'none';
        switchHintRegister.style.display = '';
        messageEl.textContent = '';
      } else {
        modeSwitch.classList.remove('on');
        modeSwitch.setAttribute('aria-pressed','false');
        registerForm.style.display = 'none';
        accessForm.style.display = '';
        cardTitle.textContent = 'Acceso';
        switchHintAccess.style.display = '';
        switchHintRegister.style.display = 'none';
        messageEl.textContent = '';
      }
    }

    modeSwitch.addEventListener('click', ()=>{ setMode(mode==='access'?'register':'access'); });
    modeSwitch.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setMode(mode==='access'?'register':'access'); } });
    toRegister.addEventListener('click', ()=> setMode('register'));
    toAccess.addEventListener('click', ()=> setMode('access'));

    function showMessage(text, ok){ messageEl.textContent = text; messageEl.className = 'msg ' + (ok? 'ok' : 'err'); }

    accessForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      showMessage('');
      const u = accessUser.value.trim();
      const p = accessPass.value.trim();
      if(!u || !p){ showMessage('Completa usuario y contraseña', false); return; }
      // call adapter
      showMessage('Verificando...', true);
      const res = await onLogin({ username: u, password: p });
      if(res.success){ showMessage(res.message || 'Acceso correcto', true); // set currentUser already in adapter
        setTimeout(()=>{ window.location.href = 'menu.html'; }, 700);
      } else {
        showMessage(res.message || 'Usuario o contraseña incorrectos', false);
      }
    });

    registerForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      showMessage('');
      const u = regUser.value.trim();
      const p = regPass.value.trim();
      if(!u || !p){ showMessage('Completa usuario y contraseña', false); return; }
      showMessage('Creando cuenta...', true);
      const res = await onRegister({ username: u, password: p });
      if(res.success){ showMessage('Cuenta creada. Ahora inicia sesión.', true);
        // switch to access and prefill username
        setMode('access'); accessUser.value = u; accessPass.value = '';
      } else {
        showMessage(res.message || 'No se pudo crear la cuenta', false);
      }
    });

    // initialize default
    setMode('access');
  </script>
</body>
</html>
